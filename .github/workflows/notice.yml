name: Inha Notice Crawler & Mailer

on:
  schedule:
    # 매일 한국 시간 오전 11:00 실행 (UTC 기준 02:00)
    - cron: '0 2 * * *'
  workflow_dispatch: # 수동 즉시 실행 버튼 활성화

jobs:
  crawl-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드시스템 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: pip install requests beautifulsoup4

      - name: 크롤러 실행 및 Gmail 전송
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_KEY: ${{ secrets.GMAIL_APP_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: 중복 발송 방지 히스토리 커밋
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_notices.json || exit 0
          git commit -m "Update seen notices history" || exit 0
          git pull --rebase origin main || exit 0
          git push origin main || exit 0
